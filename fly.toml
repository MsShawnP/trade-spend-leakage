app = 'trade-spend-leakage'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8050
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[checks]]
  name = "health"
  port = 8050
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
